<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        @font-face {
            font-family: 'Ordin';
            src: url('Ordin.otf') format('opentype');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('starbackground.png') center center / cover no-repeat;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        body {
            background: #dde4f3;
            height: 100vh;
            overflow: hidden;
            font-family: 'Ordin', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4vh;
        }

        .header, .menu {
            position: relative;
            z-index: 1;
        }

        .header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding-top: 9px;
            width: 100%;
        }

        .header img.side {
            width: 20vw;
            max-width: 300px;
            height: auto;
            image-rendering: pixelated;
            justify-self: center;
        }

        .header img.name {
            width: 45vw;
            max-width: 800px;
            min-width: 200px;
            height: auto;
            image-rendering: pixelated;
        }

        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(0.5rem, 2vh, 2rem);
        }

        .menu-item {
            display: flex;
            align-items: center;
            text-decoration: none;
            position: relative;
            width: clamp(180px, 25vw, 320px);
            justify-content: center;
        }

        .menu-box {
            font-family: 'Ordin', monospace;
            font-size: clamp(14px, 2vw, 28px);
            color: #1a1a2e;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0.5rem 2rem;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            border: 3px solid #1a1a2e;
            background: #c8d4f0;
            box-shadow:
                4px 4px 0px #8a9bc4,
                inset 2px 2px 0px #e8eef8,
                inset -2px -2px 0px #8a9bc4;
            cursor: pointer;
        }

        .cursor {
            font-size: clamp(14px, 2vw, 28px);
            color: #1a1a2e;
            opacity: 0;
            font-family: monospace;
            width: 30px;
            text-align: center;
            position: absolute;
            left: -10px;
        }

        .menu-item:hover .cursor {
            opacity: 1;
            animation: blink 0.6s step-end infinite;
        }

        .menu-item:hover .menu-box {
            background: #f0e68c;
            box-shadow:
                4px 4px 0px #b8a800,
                inset 2px 2px 0px #fffacd,
                inset -2px -2px 0px #b8a800;
            transform: translate(-2px, -2px);
        }

        .menu-item:active .menu-box {
            transform: translate(2px, 2px);
            box-shadow:
                1px 1px 0px #8a9bc4,
                inset 2px 2px 0px #8a9bc4,
                inset -2px -2px 0px #e8eef8;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.015) 2px,
                rgba(0,0,0,0.015) 4px
            );
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="fenderguitar.gif" alt="Fender Guitar" class="side">
        <img src="aakifa-akhtar.gif" alt="Aakifa Akhtar" class="name">
        <img src="cat.gif" alt="Cat" class="side">
    </div>

    <nav class="menu">
        <a href="about.html" class="menu-item">
            <span class="cursor">►</span>
            <div class="menu-box">> About Me</div>
        </a>
        <a href="projects.html" class="menu-item">
            <span class="cursor">►</span>
            <div class="menu-box">> Projects</div>
        </a>
        <a href="personal.html" class="menu-item">
            <span class="cursor">►</span>
            <div class="menu-box">> Personal</div>
        </a>
    </nav>
</body>
</html>
