<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        @font-face {
            font-family: 'Ordin';
            src: url('Ordin.otf') format('opentype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #dde4f3;
            min-height: 100vh;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        /* Header */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 2rem 2rem;
        }
        .name-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .name-row h1 {
            font-size: 2rem;
            font-weight: 300;
            color: #2c2c2c;
            letter-spacing: 1px;
        }
        .gif-placeholder {
            width: 80px;
            height: 80px;
            background: #d0e8e3;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #888;
            image-rendering: pixelated;
        }
        .gif-placeholder img {
            width: 80px;
            height: 80px;
            image-rendering: pixelated;
        }
        nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 1.5rem 0 1.5rem 0;
        }

        nav a {
            text-decoration: none;
            color: #000000;
            font-family: 'Ordin', sans-serif;
            font-size: 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #5b72bb;
        }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: center; align-items: center; padding-top: 9px; margin: 0;">
        <img src="fenderguitar.gif" alt="Fender Guitar" style="image-rendering: pixelated; width: 300px; height: auto; margin-top: 18px;">
        <img src="aakifa-akhtar.gif" alt="Aakifa Akhtar" style="image-rendering: pixelated; width: 800px; height: auto;">
        <img src="cat.gif" alt="Cat" style="image-rendering: pixelated; width: 300px; height: auto; margin-top: 39px;">
    </div>
    <nav>
        <a href="about.html">> About Me</a>
        <a href="projects.html">> Projects</a>
        <a href="personal.html">> Personal</a>
    </nav>
</body>
</html>
