<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        @font-face {
            font-family: 'Ordin';
            src: url('Ordin.otf') format('opentype');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #dde4f3;
            min-height: 100vh;
            font-family: 'Ordin', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Header row with gifs and name */
        .header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding-top: 9px;
            width: 100%;
        }

        .header img.side {
            width: 300px;
            height: auto;
            image-rendering: pixelated;
            justify-self: center;
        }

        .header img.name {
            width: 800px;
            height: auto;
            image-rendering: pixelated;
        }

        /* Menu */
        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            margin-top: 2rem;
            padding-bottom: 3rem;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            position: relative;
        }

        .menu-box {
            font-family: 'Ordin', monospace;
            font-size: 28px;
            color: #1a1a2e;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0.5rem 2rem;
            width: 320px;
            text-align: center;
            white-space: nowrap;
            border: 3px solid #1a1a2e;
            background: #c8d4f0;
            image-rendering: pixelated;
            box-shadow:
                4px 4px 0px #8a9bc4,
                inset 2px 2px 0px #e8eef8,
                inset -2px -2px 0px #8a9bc4;
            transition: none;
            position: relative;
            cursor: pointer;
        }

        /* Pixel art cursor arrow */
        .cursor {
            font-size: 28px;
            color: #1a1a2e;
            opacity: 0;
            font-family: monospace;
            transition: none;
            width: 30px;
            text-align: center;
        }

        /* Hover / focus state - mimics game selection */
        .menu-item:hover .cursor,
        .menu-item:focus .cursor {
            opacity: 1;
            animation: blink 0.6s step-end infinite;
        }

        .menu-item:hover .menu-box,
        .menu-item:focus .menu-box {
            background: #f0e68c;
            color: #1a1a2e;
            box-shadow:
                4px 4px 0px #b8a800,
                inset 2px 2px 0px #fffacd,
                inset -2px -2px 0px #b8a800;
            transform: translate(-2px, -2px);
        }

        .menu-item:active .menu-box {
            transform: translate(2px, 2px);
            box-shadow:
                1px 1px 0px #8a9bc4,
                inset 2px 2px 0px #8a9bc4,
                inset -2px -2px 0px #e8eef8;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @media (max-width: 768px) {
            .header {
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
                padding-top: 9px;
            }

            .header img.side {
                width: 100px;
            }

            .header img.name {
                width: 200px;
            }

            .menu-box {
                font-size: 16px;
                padding: 0.5rem 1.5rem;
                width: 200px;
                text-align: center;
            }

            .menu-item {
                width: 200px;
            }

            .cursor {
                font-size: 16px;
            }
        }
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.015) 2px,
                rgba(0,0,0,0.015) 4px
            );
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="fenderguitar.gif" alt="Fender Guitar" class="side left">
        <img src="aakifa-akhtar.gif" alt="Aakifa Akhtar" class="name">
        <img src="cat.gif" alt="Cat" class="side right">
    </div>

    <nav class="menu">
        <a href="about.html" class="menu-item">
            <span class="cursor">►</span>
            <div class="menu-box">> About Me</div>
        </a>
        <a href="projects.html" class="menu-item">
            <span class="cursor">►</span>
            <div class="menu-box">> Projects</div>
        </a>
        <a href="personal.html" class="menu-item">
            <span class="cursor">►</span>
            <div class="menu-box">> Personal</div>
        </a>
    </nav>

</body>
</html>
